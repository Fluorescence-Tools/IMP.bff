schema_version: 1

context:
  version: "0.15.0"

package:
  name: imp.bff
  version: ${{ version }}

source:
  path: ../
  use_gitignore: true   # the root scratch (.gitignore) stays out of the source copy

build:
  number: 0
  # No explicit `script:` -- rattler-build auto-discovers build.sh (unix) /
  # bld.bat (windows) in the recipe directory by platform. An explicit
  # `script:` field does not support if/then/else selectors (only
  # interpreter/env/secrets/content/file/cwd), so this is the only way to
  # keep one recipe driving both platform scripts.

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - pooch   # the build fetches the large data (data/registry.json)
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - if: unix
      then: pkg-config
    - swig
    - cmake
    - ninja
    - graphviz
    - python
    - numpy
  host:
    - python
    - numpy
    # libboost-devel, not boost-cpp: conda-forge split the monolithic
    # boost-cpp package into libboost/libboost-devel, and imp >=2.25.0
    # already builds against the split packages -- boost-cpp and libboost
    # are mutually exclusive in one environment. Matches imp's own recipe
    # (conda-forge/imp-feedstock/recipe/meta.yaml).
    - libboost-devel
    - eigen
    - cereal
    - if: win
      then:
        - mpir
        - msmpi
    # >=2.25.0: older imp builds ship a swig_helpers_base.h that calls
    # Python-2-only C API symbols (PyString_Check, PyInt_Check, ...) removed
    # by SWIG 4.5's dropped compat macros -- fixed upstream in IMP itself
    # (conda-forge/imp-feedstock's imp-swig45.patch) and first published in
    # the 2.25.0 build. Without this floor the solver is free to pick an
    # older, broken imp build even though a fixed one is available.
    - imp >=2.25.0
    # conda-forge's imp pins the SWIG runtime ABI through this metapackage,
    # and the module generated here shares IMP's SWIG type tables -- the
    # runtime our `swig` generates against has to be the one imp was built
    # with, so pin it the same way (imp-feedstock hosts it too).
    - swig-abi
  run:
    - ${{ pin_compatible('numpy') }}
    - python
    - ${{ pin_compatible('imp', upper_bound='x.x') }}
    # No explicit libboost entry: libboost-devel's run_exports add it
    # automatically, same as imp's own recipe does.
    - pandas
    - mdtraj
    - tqdm
    - click
    - click-didyoumean
  run_constraints:
    # never beside the IMP-free core (package `bff`, recipe-core.yaml): both
    # install site-packages/IMP/bff/
    - bff <0.0.0a0

tests:
  # The module must *import*, and until 2026-09-09 nothing here checked that.
  # `imp_bff --help` is a console script that does not touch the extension, so
  # a package whose `_IMP_bff.so` could not resolve its symbols passed these
  # tests and failed on the user's first `import IMP.bff`. That is exactly
  # what happened: `src/ImpLayer.cpp` omitted one of the fourteen files it
  # aggregates, the module would not link, and the installed library had been
  # built before the omission existed so nothing noticed for weeks.
  - python:
      imports:
        - IMP.bff
  - script:
      - imp_bff --help
      # this build, not the IMP-free core (recipe-core.yaml asserts 'core')
      # the spot-check runs first: it says how deep the surface goes, so a
      # get_build failure here is not hiding a missing-wrap failure behind it
      - python -c "import IMP.bff as b; [getattr(b, n) for n in ('Dataset', 'ChiSquared', 'JointChiSquared', 'EvaluationGraph', 'Minimizer', 'TcspcDecay')]"
      - python -c "import IMP.bff as b; assert b.get_build() == 'imp', b.get_build()"
      # the compute door is compiled in; whether a *backend* loads is a
      # run-time question about the machine and is deliberately not asserted
      - python -c "import IMP.bff as b; assert b.built_with_gpu_support()"


about:
  homepage: https://github.com/fluorescence-tools/imp.bff
  license: MPL-2.0
  # Relative to the source root (source: path: ../ copies the repo flat into
  # the work dir), not the recipe directory.
  license_file: COPYING.LGPL
  summary: Bayesian Framework for Fluorescence for the integrative modeling platform
  description: |
    The Bayesian Framework for Fluorescence (BFF) for the integrative modeling
    platform (IMP) is C++ software with Python wrappers. IMP.bff was designed
    for Bayesian analysis of spectroscopic data.
  documentation: https://docs.peulen.xyz/imp.bff

extra:
  recipe-maintainers:
    - tpeulen
