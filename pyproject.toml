# The IMP-free core of IMP.bff as a pip package (PRD-137 step 6d).
#
# Package name `bff`, import name `IMP.bff` -- the same import the IMP module
# build (conda package `imp.bff`) provides. The two are alternatives, not
# companions: both own site-packages/IMP/bff/.
#
# The build is standalone/CMakeLists.txt under scikit-build-core; the wheel
# holds IMP/bff/{__init__.py,_IMP_bff.so,libimp_bff.*,data/<small set>}.
# rotamer_library/ and cgprobe/ (62 MB) are fetched on first use from
# IMP.bff.DATA_URL against data/registry.json (utility/data_registry.py).
[project]
name = "bff"
dynamic = ["version"]
requires-python = ">=3.9"
description = "Bayesian Framework for Fluorescence: the IMP-free core, importable as IMP.bff"
readme = "README.md"
authors = [{ name = "Thomas-Otavio Peulen", email = "thomas.otavio.peulen@gmail.com" }]
license = { text = "MPL-2.0" }
keywords = ["fluorescence", "FRET", "accessible volume", "spectroscopy", "integrative modeling"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pooch>=1.8",
]

[project.optional-dependencies]
test = ["pytest", "scipy", "pandas", "mrcfile"]
# The accelerator, which this package deliberately does not carry itself.
#
# `libimp_bff_wgpu` -- a few hundred kilobytes, built here and shipped in the
# wheel -- is a plugin that links nothing and resolves every wgpu entry point
# by `dlopen` at run time. What it needs is a wgpu-native library, and that is
# 6.6-8.9 MB that somebody already ships for every platform this wheel
# targets: `wgpu` (wgpu-py) puts it in `wgpu/resources/`, where
# `IMP.bff.enable_gpu()` looks for it. So `pip install bff` stays as small as
# it is and runs on the CPU; `pip install bff[gpu]` turns the GPU on.
#
# Not a hard dependency, and not vendored: the CPU path is the default and
# must keep working on machines with no GPU at all. The conda packages take
# the same line -- neither recipe lists wgpu, and a conda user who wants the
# accelerator installs `wgpu` into the same environment, where the same search
# finds it.
gpu = ["wgpu>=0.32"]

[project.scripts]
imp_bff_fetch_data = "IMP.bff:_fetch_data_main"

[project.urls]
homepage = "https://github.com/fluorescence-tools/imp.bff"
documentation = "https://docs.peulen.xyz/imp.bff"
repository = "https://github.com/fluorescence-tools/imp.bff.git"

[build-system]
requires = ["scikit-build-core>=0.10", "setuptools_scm>=8", "numpy", "swig>=4.1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.source-dir = "standalone"
cmake.args = [
    "-DIMPBFF_WHEEL:BOOL=ON",
    "-DIMPBFF_PYTHON:BOOL=ON",
    # No RMF in the wheel, measured (PRD-139): librmf is 3.2 MB but links
    # Boost.Iostreams, which as packaged -- conda and Homebrew alike -- links
    # Boost.Regex and all of ICU. The repaired wheel carried 45 MB of bundled
    # libraries, 40 of them for this; without it the extension links nothing
    # outside the wheel at all. The whole test lane passes either way: RMF is
    # four I/O functions called from `imp_bff`, not from the library. The
    # conda packages keep it, so `.rmf` files stay readable there.
    "-DIMPBFF_WITH_RMF:BOOL=OFF",
    "-DCMAKE_BUILD_TYPE=Release",
]
# No source-tree package: standalone/CMakeLists.txt installs the SWIG shadow
# module as IMP/bff/__init__.py with the extension and libimp_bff beside it.
# IMP/ itself gets no __init__.py -- it is a namespace portion, so a real IMP
# (a regular package) can own IMP/ when the conda imp.bff package is used
# instead.
wheel.packages = []
build-dir = "build/{wheel_tag}"
# Stripped, then re-signed: standalone/CMakeLists.txt signs the binaries in
# an install(CODE) step that runs after the install, which is what makes this
# safe on arm64 macOS (a stale signature is a SIGKILL on load).
install.strip = true
install.components = ["python", "data"]
# git-tracked files, minus what a wheel build never reads
sdist.exclude = ["doc/", "benchmark/", "conda-recipe/", ".github/", "data/rotamer_library/", "data/cgprobe/", "prototypes/"]

[tool.scikit-build.metadata]
version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
# tags are vX.Y.Z; a commit past the tag is X.Y.(Z+1).devN+g<sha>.
# The wheel's version comes from the tag, not from the number in
# standalone/CMakeLists.txt or the conda recipes -- those are the fallback
# and the conda packages respectively, so a release is not a release until
# the tag exists.

[tool.cibuildwheel]
build-verbosity = 1
# Windows waits for a Boost/Eigen/RMF story on that platform (tttrlib's vcpkg
# pattern); 3.13t/3.14 wait for numpy and SWIG.
skip = ["pp*", "*-win*", "*-manylinux_i686", "*-musllinux_*", "cp314-*", "cp314t-*", "cp313t-*"]
test-requires = ["pytest", "pooch"]
test-command = "python -c \"import IMP.bff as b; assert b.get_build() == 'core'; [getattr(b, n) for n in ('Dataset', 'ChiSquared', 'JointChiSquared', 'EvaluationGraph', 'Minimizer', 'TcspcDecay')]; assert b.built_with_gpu_support(); print(b.get_module_version())\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
archs = ["x86_64"]
# Boost and Eigen headers from the distribution; cereal from
# utility/wheel_deps.sh. The core needs no compiled Boost and, without RMF
# (above), nothing else outside the wheel -- auditwheel finds nothing to
# vendor, which is the point.
before-all = "dnf install -y --nogpgcheck boost-devel eigen3-devel && bash utility/wheel_deps.sh /usr/local"
# WITH_RMF=0 in wheel_deps.sh too: nothing to build when the wheel has no RMF
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_{arch} -w {dest_dir} {wheel}"

[tool.cibuildwheel.linux.environment]
CMAKE_PREFIX_PATH = "/usr/local;/usr"

[tool.cibuildwheel.macos]
# one architecture per runner (RMF is built natively in before-all);
# the workflow runs macos-14 (arm64) and macos-13 (x86_64)
before-all = "brew install boost eigen && bash utility/wheel_deps.sh $HOME/imp-bff-deps"
before-build = "pip install delocate"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.macos.environment]
CMAKE_PREFIX_PATH = "$HOME/imp-bff-deps;$(brew --prefix)"
MACOSX_DEPLOYMENT_TARGET = "11.0"
