name: CI

# Two builds, then the tests, on macOS, Linux and Windows:
#
#   1. bff as an IMP module      -- the conda package `imp.bff`
#   2. bff as a standalone pip   -- the wheels of the IMP-free core (`bff`,
#      package                      import name IMP.bff)
#
# Both carry a test stage: the conda package against the fast + medium
# tiers, the wheel through cibuildwheel's test-command.

on:
  push:
    # Only the integration branches build on push: independent-core reaches
    # CI as a push to dev in the same breath (the same commit), so a push
    # trigger on '**' built everything twice. Other branches enter through
    # a PR to dev/main or a manual dispatch.
    branches: [dev, main]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR. Without this every push queues a fresh copy of the
# whole matrix behind the last one, and a fix waits on results nobody wants
# any more. main and tags are exempt: a release build has to finish even if
# another push lands while it runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── Decide how much of the matrix this run earns ──────────────────────────
  #
  # A feature branch gets one fast Linux leg per build. dev, main, releases
  # and manual runs get the full three-platform matrix -- that is where
  # "builds on all platforms" actually has to hold, not on every WIP push.
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.check.outputs.lane }}
      os_matrix: ${{ steps.check.outputs.os_matrix }}
      wheel_matrix: ${{ steps.check.outputs.wheel_matrix }}
    steps:
      - id: check
        run: |
          BRANCH="${{ github.ref }}"
          if [[ "$BRANCH" == "refs/heads/main" || "$BRANCH" == "refs/heads/dev" || \
                "$BRANCH" == refs/tags/* || \
                "${{ github.event_name }}" == "release" || \
                "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "lane=full" >> "$GITHUB_OUTPUT"
            echo 'os_matrix={"os":["ubuntu-latest","macos-14","windows-latest"]}' >> "$GITHUB_OUTPUT"
            echo 'wheel_matrix={"include":[{"os":"ubuntu-latest","arch":"x86_64"},{"os":"macos-14","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"},{"os":"windows-2022","arch":"AMD64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "lane=fast" >> "$GITHUB_OUTPUT"
            echo 'os_matrix={"os":["ubuntu-latest"]}' >> "$GITHUB_OUTPUT"
            echo 'wheel_matrix={"include":[{"os":"ubuntu-latest","arch":"x86_64"}]}' >> "$GITHUB_OUTPUT"
          fi

  # ── 1. bff as an IMP module: the conda package `imp.bff` ──────────────────
  imp_module:
    name: IMP module (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      # Stop the matrix early when one OS lane fails, so CI time is not
      # spent on likely-redundant builds.
      fail-fast: true
      matrix: ${{ fromJson(needs.setup.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: false

      - name: Cache conda packages
        id: get-date
        run: echo "week=$(/bin/date -u '+%Y-%U')" >> "$GITHUB_OUTPUT"
        shell: bash
      # continue-on-error: caching is an optimization, not a correctness
      # requirement -- a cache-service hiccup (or, under `act` locally, a
      # known image gap -- nektos/act#107) must not fail the build.
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.CONDA }}/pkgs
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('conda-recipe/recipe.yaml') }}-${{ steps.get-date.outputs.week }}
          restore-keys: |
            conda-pkgs-${{ runner.os }}-${{ hashFiles('conda-recipe/recipe.yaml') }}-
            conda-pkgs-${{ runner.os }}-

      # sccache caches object files across runs (via the GitHub Actions cache
      # backend), so only what actually changed since the last run on this OS
      # recompiles. build.sh/bld.bat pass the launcher flags only when a
      # `sccache` binary is on PATH, so a machine without this action set up
      # still builds fine, just without the speedup.
      - uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
      - name: Enable sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"

      # Windows: `bash -el` steps degraded into a cmd banner and never ran
      # mamba (two runs in a row), so the builder is the standalone release
      # binary -- Rust, no conda needed. Linux and macOS keep the conda
      # package.
      - name: Install rattler-build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "v0.76.0"
          $url = "https://github.com/prefix-dev/rattler-build/releases/download/$tag/rattler-build-x86_64-pc-windows-msvc.zip"
          $dest = "$env:RUNNER_TEMP\rattler-build"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$dest\rattler-build.zip"
          Expand-Archive -Path "$dest\rattler-build.zip" -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter rattler-build.exe |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Host "::error::the rattler-build zip holds no rattler-build.exe"
            Get-ChildItem -Path $dest -Recurse | Select-Object FullName
            exit 1
          }
          echo "RATTLER_BUILD_EXE=$($exe -replace '\\','/')" >> $env:GITHUB_ENV
      - name: Install rattler-build (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: mamba install -y rattler-build

      # ── our own imp ────────────────────────────────────────────────────────
      # The published conda-forge imp ships salilab/imp's historical bff
      # module -- its Python files land in site-packages/IMP/bff/ and its
      # swig fragments in share/IMP/swig/, clobbering (or clobbered by)
      # this package's IMP.bff: a fresh build answered import with the old
      # module's surface. So the job builds imp itself, from conda-forge's
      # recipe (conda-recipe/imp/, trimmed to the 14 modules bff uses,
      # bff disabled) and cached by the recipe's content.
      # The key is stable for this runner and recipe revision, so successful
      # builds are exact cache hits on later runs. A failed build is never
      # saved, which prevents a partial dependency tree from poisoning the
      # next run.
      - name: Restore our imp package
        id: imp-cache
        uses: actions/cache/restore@v4
        with:
          path: imp-bld
          key: imp-trimmed-${{ runner.os }}-${{ hashFiles('conda-recipe/imp/**') }}
      - name: Build our imp (when the cache is cold)
        shell: bash -el {0}
        run: |
          RATTLER_BUILD_BIN="${CONDA}/envs/test/bin/rattler-build"
          if [ ! -x "$RATTLER_BUILD_BIN" ]; then
            RATTLER_BUILD_BIN="${CONDA}/bin/rattler-build"
          fi
          if [ ! -x "$RATTLER_BUILD_BIN" ]; then
            RATTLER_BUILD_BIN="$(command -v rattler-build || true)"
          fi

          if [ -z "$RATTLER_BUILD_BIN" ]; then
            echo "::error::could not locate rattler-build"
            echo "CONDA=$CONDA"
            which conda || true
            ls -la "${CONDA}/bin" | head -n 20 || true
            ls -la "${CONDA}/envs/test/bin" | head -n 20 || true
            exit 1
          fi
          echo "Using rattler-build=$RATTLER_BUILD_BIN"
          # A cache miss leaves no imp-bld directory.  Under bash -e the old
          # find|grep guard exited here with status 1, so rattler-build never
          # ran and the job failed in 1s.  Treat a missing directory as an
          # ordinary cache miss.
          if [ -d imp-bld ]; then
            archive=$(find imp-bld -type f \( -name '*.conda' -o -name '*.tar.bz2' \) -print -quit 2>/dev/null || true)
            if [ -n "$archive" ]; then
              exit 0
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RATTLER_BUILD_EXE" build --recipe conda-recipe/imp/recipe.yaml \
                --env-isolation none \
                --channel conda-forge --output-dir imp-bld
          else
            # `rattler-build` is installed in `envs/test`; launch through the
            # same activation path the shell uses, so runtime context is explicit.
            source "${CONDA}/etc/profile.d/conda.sh"
            conda activate "${CONDA}/envs/test"
            "$RATTLER_BUILD_BIN" --version
            echo "rattler-build path: $RATTLER_BUILD_BIN"
            file "$RATTLER_BUILD_BIN"
            echo "rattler-build dependencies:"
            ldd "$RATTLER_BUILD_BIN" || true
            "$RATTLER_BUILD_BIN" build \
                --recipe conda-recipe/imp/recipe.yaml \
                --env-isolation none \
                --channel conda-forge --output-dir imp-bld
            conda deactivate
          fi
      - name: Save our imp package
        if: steps.imp-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: imp-bld
          key: imp-trimmed-${{ runner.os }}-${{ hashFiles('conda-recipe/imp/**') }}
      # The large data (data/registry.json) is not in git: it comes from the
      # download host, cached between runs keyed by the registry (tttrlib's
      # pattern) so only a changed registry downloads again. The build
      # scripts copy from this cache into data/ (IMP_BFF_DATA_CACHE) and the
      # checkout gets it too, for the tests that read data/ directly.
      - name: Cache the large data
        uses: actions/cache@v4
        with:
          path: ~/.cache/imp-bff-data
          key: imp-bff-data-${{ hashFiles('data/registry.json') }}
      - name: Fetch the large data
        shell: bash -el {0}
        run: |
          python -m pip install -q pooch
          # cgprobe only: the 229-file rotamer_library is the bulk of the
          # download, and the tests read it through the packaged copy
          # (share/IMP/bff), not the checkout.
          python utility/data_registry.py --fetch data --only cgprobe \
              --cache "$HOME/.cache/imp-bff-data" --quiet
          echo "IMP_BFF_DATA_CACHE=$HOME/.cache/imp-bff-data" >> "$GITHUB_ENV"

      - name: Build the conda package
        shell: bash -el {0}
        # --env-isolation none: rattler-build's default (`strict`) hands
        # build.sh a clean environment, which silently cost two caches --
        # IMP_BFF_DATA_CACHE never reached it, so every package build
        # re-downloaded all 284 registry files from peulen.xyz, and the
        # sccache GHA tokens never did, so compiles cached to local disk
        # (wiped with the work dir). `none` inherits the host environment,
        # tttrlib's effective behavior under conda-build.
        run: |
          RATTLER_BUILD_BIN="${CONDA}/envs/test/bin/rattler-build"
          if [ ! -x "$RATTLER_BUILD_BIN" ]; then
            RATTLER_BUILD_BIN="${CONDA}/bin/rattler-build"
          fi
          if [ ! -x "$RATTLER_BUILD_BIN" ]; then
            RATTLER_BUILD_BIN="$(command -v rattler-build || true)"
          fi
          if [ -z "$RATTLER_BUILD_BIN" ]; then
            echo "::error::could not locate rattler-build"
            echo "CONDA=$CONDA"
            which conda || true
            ls -la "${CONDA}/bin" | head -n 20 || true
            ls -la "${CONDA}/envs/test/bin" | head -n 20 || true
            exit 1
          fi
          echo "Using rattler-build=$RATTLER_BUILD_BIN"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RATTLER_BUILD_EXE" build --recipe conda-recipe/recipe.yaml \
                --env-isolation none \
                --channel ./imp-bld --channel conda-forge \
                --output-dir conda-bld
          else
            # `rattler-build` is installed in `envs/test`; launch through the
            # same activation path the shell uses, so runtime context is explicit.
            source "${CONDA}/etc/profile.d/conda.sh"
            conda activate "${CONDA}/envs/test"
            "$RATTLER_BUILD_BIN" --version
            echo "rattler-build path: $RATTLER_BUILD_BIN"
            file "$RATTLER_BUILD_BIN"
            echo "rattler-build dependencies:"
            ldd "$RATTLER_BUILD_BIN" || true
            "$RATTLER_BUILD_BIN" build \
                --recipe conda-recipe/recipe.yaml \
                --env-isolation none \
                --channel ./imp-bld --channel conda-forge \
                --output-dir conda-bld
            conda deactivate
          fi

      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats

      # Retries: this reuses the same conda package cache rattler-build's own
      # internal test env (the recipe's `imp_bff --help` smoke test) just
      # solved into moments earlier, and an in-progress lock on that cache
      # occasionally isn't released before this step starts, corrupting an
      # extraction ("Could not set lock", empty index.json). Transient, not a
      # dependency problem -- a clean retry always passes.
      - name: Install the freshly built package into a test env
        shell: bash -el {0}
        run: |
          for attempt in 1 2 3; do
            # --strict-channel-priority: our imp must win the 2.25.0 tie
            # against conda-forge's (whose build carries the historical bff
            # on the same paths) even if its build number ever ties again.
            conda create -y -n bff-test --strict-channel-priority \
              -c ./conda-bld -c ./imp-bld -c conda-forge \
              imp.bff pytest pooch && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "retrying test env creation (attempt $attempt failed)"
            sleep 10
          done

      # test_*.py (fast) and medium_test_*.py (medium) run on every push;
      # expensive_test_*.py stays off CI. Neither tier is picked up by
      # pytest's default `test_*.py` glob, so the file lists are built
      # explicitly rather than relying on collection.
      - name: Run fast + medium tests
        shell: bash -el {0}
        run: |
          # Keep test discovery and execution in the same interpreter invocation
          # to avoid shell-feature differences across runners.
          conda run -n bff-test --no-capture-output python - <<'PY'
            import os
            import subprocess
            import sys
            from pathlib import Path

            # Our imp's compiled-in data/example paths do not survive rattler's
            # prefix relocation; set these first (IMP checks here first).
            conda_prefix = os.environ["CONDA_PREFIX"]
            os.environ["IMP_DATA"] = str(Path(conda_prefix) / "share" / "IMP")
            os.environ["IMP_EXAMPLE_DATA"] = str(Path(conda_prefix) / "share" / "doc" / "IMP" / "examples")

            tests = sorted(
                str(p) for p in Path("test").rglob("*.py")
                if p.name.startswith("test_") or p.name.startswith("medium_test_")
            )
            if not tests:
              print("No matching fast/medium tests found under test/")
              sys.exit(0)

            print(f"{len(tests)} test files selected")
            sys.exit(
                subprocess.call([sys.executable, "-m", "pytest", *tests, "-v"])
            )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: conda-package-${{ matrix.os }}
          path: conda-bld/**/*.conda
          if-no-files-found: error

  # ── 2. bff as a standalone pip package: the IMP-free core, as wheels ──────
  #
  # Built from standalone/CMakeLists.txt under scikit-build-core via
  # cibuildwheel; the config lives in [tool.cibuildwheel] in pyproject.toml.
  # Import name IMP.bff, get_build() == 'core'; the wheel's own test-command
  # is the test stage.
  pip_wheel:
    name: Wheel (${{ matrix.os }}, ${{ matrix.arch }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      # Stop the wheel matrix early when one OS/arch lane fails.
      fail-fast: true
      matrix: ${{ fromJson(needs.setup.outputs.wheel_matrix) }}
    # sccache, via the same GitHub Actions cache backend the conda builds
    # use; the compiler launchers that switch it on live in pyproject.toml's
    # [tool.cibuildwheel.*.environment] tables -- setting them here through
    # CIBW_ENVIRONMENT_* would replace those tables wholesale (tttrlib's
    # measured lesson). The sccache action's ACTIONS_CACHE_URL and
    # ACTIONS_RUNTIME_TOKEN are inherited from the job by the cibuildwheel
    # subprocesses. SCCACHE_IDLE_TIMEOUT=0 keeps the server alive for the
    # whole job: it otherwise exits after 600 s idle and takes the counters
    # with it, so a build followed by tests reports "0 compile requests"
    # while the cache was in fact hitting.
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools_scm reads the tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Windows: MSVC on PATH, Boost and Eigen from vcpkg, cereal headers
      #    from the repo's own script. Everything the core needs is
      #    header-only, so the wheel links nothing outside itself.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      # actions/cache's `path` is evaluated from the `env` context, which
      # holds only what a workflow, job or step declared -- not the runner
      # image's own environment. VCPKG_INSTALLATION_ROOT is the latter, so
      # it goes to GITHUB_ENV first (tttrlib's pattern).
      - name: Resolve the vcpkg root into the env context
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT_RESOLVED=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Cache vcpkg Boost and Eigen
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT_RESOLVED }}\installed
          key: vcpkg-bff-x64-windows-${{ runner.os }}-v1
      - name: Install Boost and Eigen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Header-only ports of exactly what the core includes
          # (boost/random, boost/range). vcpkg's network installs fail
          # transiently often enough to warrant the retry.
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            & $vcpkg install boost-random boost-range eigen3:x64-windows --recurse --no-print-usage
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit 1 }
            Write-Host "vcpkg install failed (attempt $i of $attempts); retrying in 90 s"
            Start-Sleep -Seconds 90
          }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          # vcpkg's status database is inside installed/, so a partially
          # restored cache reports "already installed" and the failure
          # surfaces much later as a configure error with nothing pointing
          # back here. The eigen3 port keeps the headers under include/eigen3.
          foreach ($f in @("include\boost\version.hpp", "include\eigen3\Eigen\Dense", "share\eigen3\Eigen3Config.cmake")) {
            if (-not (Test-Path "$root\$f")) {
              Write-Host "::error::vcpkg reported success but $root\$f is missing."
              Write-Host "The cached vcpkg tree is incomplete. Bump the key"
              Write-Host "suffix (vcpkg-bff-...-v1) to force a clean rebuild."
              exit 1
            }
          }
          echo "VCPKG_PREFIX=$root" >> $env:GITHUB_ENV
      - name: Fetch cereal headers (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash utility/wheel_deps.sh "$USERPROFILE/imp-bff-deps"

      - name: Build the wheels
        run: |
          python -m pip install cibuildwheel==2.23.3
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ── Publish the wheels to PyPI on a published GitHub Release ──────────────
  #
  # Trusted publishing: the PyPI project `bff` must list this workflow as a
  # publisher (owner's step on pypi.org) before the first release runs this.
  publish_wheels:
    name: Publish wheels to PyPI
    needs: pip_wheel
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
